name: Teste

on:
  push:
    branches: [main, master]
    # modificările de conținut făcute din panoul de administrare nu schimbă codul: nu mai rulăm testele pentru ele
    paths-ignore: ['storage/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
